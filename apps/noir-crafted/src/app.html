<!doctype html>
<html lang="tr" %sveltekit.theme%>
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Load Three.js from CDN FIRST - ensures it's available before React Three Fiber -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.min.js"></script>
    <script>
      // Ensure THREE is available globally for React Three Fiber
      if (typeof window !== 'undefined' && window.THREE) {
        window.THREE = window.THREE;
        if (typeof globalThis !== 'undefined') {
          globalThis.THREE = window.THREE;
        }
        console.log('[HTML] Three.js loaded from CDN');
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
